# Build the browser playground (Rust → Wasm) and deploy to GitHub Pages.
# Enable: Repository → Settings → Pages → Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Build Wasm bundle
        run: |
          cd wasm
          wasm-pack build --target web --out-dir ../docs/playground/pkg --release --no-typescript --no-opt

      - name: Disable Jekyll (keep paths like pkg/ intact)
        run: touch docs/playground/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/playground

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
