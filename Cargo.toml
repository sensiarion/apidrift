[workspace]
members = [".", "wasm"]
default-members = ["."]
resolver = "2"

[package]
name = "apidrift"
version = "0.1.4"
edition = "2021"
authors = ["sensiarion <izertmi@gmail.com>"]
license = "Apache-2.0"
description = "A tool to compare OpenAPI specifications and detect breaking changes"
repository = "https://github.com/sensiarion/apidrift"
homepage = "https://github.com/sensiarion/apidrift"
keywords = ["apidrift", "openapi", "api", "diff", "breaking-changes", "swagger"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
oas3 = { version = "0.20.1", features = ["yaml-spec"] }
serde_json = "1.0"
tera = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4.28"
serde_path_to_error = "0.1.20"

# CLI / desktop only (not used by the library on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.8"
open = "5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
