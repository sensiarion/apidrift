openapi: 3.0.3
info:
  title: ApiDrift Sample API (current)
  version: 2.0.0
servers:
  - url: https://api.example.com
paths:
  /users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeDeleted
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "410":
          description: Gone
  /users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /products:
    get:
      summary: List products
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /orders:
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    User:
      type: object
      required: [id, email, username]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: uri
        username:
          type: string
          description: Public username (now required)
        status:
          $ref: "#/components/schemas/UserStatus"
    CreateUserRequest:
      type: object
      required: [email, username]
      properties:
        email:
          type: string
          format: uri
        username:
          type: string
          minLength: 3
    Product:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
          format: double
        category:
          type: string
          enum: [electronics, clothing, food, books, toys]
        tags:
          type: array
          items:
            type: string
    CreateOrderRequest:
      type: object
      required: [userId, productId]
      properties:
        userId:
          type: integer
        productId:
          type: integer
        quantity:
          type: integer
          default: 1
    Order:
      type: object
      required: [id, userId, productId]
      properties:
        id:
          type: string
        userId:
          type: integer
        productId:
          type: integer
        status:
          $ref: "#/components/schemas/OrderStatus"
    UserStatus:
      type: string
      enum: [active, completed, cancelled]
    OrderStatus:
      type: string
      enum: [created, paid, shipped]
